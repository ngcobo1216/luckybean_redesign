<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Lucky Bean Restaurant for bookings, feedback, or general inquiries. Find our location in Melville.">
    <title>Contact Us | Lucky Bean Restaurant</title>
    
    <link rel="stylesheet" href="css/style.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <style>
        /* Specific styling for the map container */
        #map {
            height: 400px; /* The map MUST have a height */
            width: 100%;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .contact-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #2c5e2e; color: white; padding: 10px 20px; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #1a3c1b; }
        .error { color: red; font-size: 0.9em; display: none; }
    </style>
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="enquiry.html">Enquiries</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-container">
        <h1>Contact Lucky Bean</h1>
        <p>We'd love to hear from you. Send us a message or visit us in Melville.</p>

        <h2>Find Us</h2>
        <div id="map"></div>

        <h2>Send a Message</h2>
        <form id="contactForm" novalidate>
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <div class="error" id="nameError">Name is required.</div>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <div class="error" id="emailError">Valid email is required.</div>
            </div>

            <div class="form-group">
                <label for="msgType">Message Type:</label>
                <select id="msgType" name="msgType">
                    <option value="General">General Inquiry</option>
                    <option value="Feedback">Feedback/Review</option>
                    <option value="Compliment">Compliment</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
                <div class="error" id="msgError">Message cannot be empty.</div>
            </div>

            <button type="submit">Send Message</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2025 Lucky Bean Restaurant</p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script src="js/contact.js"></script>
</body>
</html>
