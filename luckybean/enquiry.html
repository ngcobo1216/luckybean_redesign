<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Enquire about table reservations, private events, and catering at Lucky Bean Restaurant.">
    <title>Enquiries | Lucky Bean Restaurant</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Specific Styles for the Form Validation UI */
        .form-container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: #f9f9f9; /* Light background for contrast */
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #333;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
        }
        button.btn-submit {
            background-color: #2c5e2e; /* Lucky Bean Green */
            color: white;
            padding: 12px 24px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            border-radius: 4px;
            width: 100%;
        }
        button.btn-submit:hover {
            background-color: #1a3c1b;
        }
        /* The Result Box for Part 3 Requirement */
        #calculationResult {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none; /* Hidden by default */
        }
        .success-box {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error-message {
            color: red;
            font-size: 0.85rem;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="enquiry.html">Enquiries</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="form-container">
            <h1>Make an Enquiry</h1>
            <p>Interested in dining with us? Fill out the form below to check costs and availability.</p>

            <form id="enquiryForm" action="#" method="POST" novalidate>
                
                <div class="form-group">
                    <label for="fullName">Full Name:</label>
                    <input type="text" id="fullName" name="fullName" required>
                    <span class="error-message" id="nameError">Please enter your name.</span>
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                    <span class="error-message" id="emailError">Please enter a valid email.</span>
                </div>

                <div class="form-group">
                    <label for="serviceType">Type of Service:</label>
                    <select id="serviceType" name="serviceType" required onchange="toggleGuestInput()">
                        <option value="">-- Please Select --</option>
                        <option value="reservation">Standard Table Reservation</option>
                        <option value="private">Private Event (Venue Hire)</option>
                        <option value="catering">External Catering</option>
                    </select>
                </div>

                <div class="form-group" id="guestField">
                    <label for="guests">Number of Guests:</label>
                    <input type="number" id="guests" name="guests" min="1" max="100">
                </div>

                <div class="form-group">
                    <label for="comments">Additional Requests:</label>
                    <textarea id="comments" name="comments" rows="4"></textarea>
                </div>

                <button type="submit" class="btn-submit">Check Availability / Quote</button>
            </form>

            <div id="calculationResult"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Lucky Bean Restaurant</p>
    </footer>

    <script src="js/enquiry.js"></script>
</body>
</html>
